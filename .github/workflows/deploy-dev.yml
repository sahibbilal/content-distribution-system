name: Deploy to Rewamp-Dev

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy dev site
    runs-on: ubuntu-latest
    environment: wpcorex-dev-env

    steps:
      # Full history so we can diff against the commit that was last deployed
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare SSH
        if: ${{ vars.SSH_HOST_DEV && vars.SSH_USERNAME_DEV && vars.DEPLOY_PATH_DEV }}
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY_DEV }}
          SSH_HOST: ${{ vars.SSH_HOST_DEV }}
          SSH_USER: ${{ vars.SSH_USERNAME_DEV }}
          SSH_PORT: ${{ vars.SSH_PORT_DEV || 22 }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf 'Host deploy\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  StrictHostKeyChecking accept-new\n  ServerAliveInterval 30\n' \
            "$SSH_HOST" "$SSH_USER" "$SSH_PORT" > ~/.ssh/config
          chmod 600 ~/.ssh/config

      # The server records the commit it last deployed. If no frontend file changed since then
      # (and a build is already on the server), the npm install and build are skipped.
      - name: Detect what changed
        id: changes
        if: ${{ vars.SSH_HOST_DEV && vars.SSH_USERNAME_DEV && vars.DEPLOY_PATH_DEV }}
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH_DEV }}
        run: |
          build=true
          LAST=$(ssh deploy "cat '$DEPLOY_PATH/.deploy-sha' 2>/dev/null" || true)
          if [ -n "$LAST" ] && git cat-file -e "$LAST^{commit}" 2>/dev/null \
             && ssh deploy "test -f '$DEPLOY_PATH/public/build/manifest.json'"; then
            echo "Last deployed commit: $LAST"
            if git diff --name-only "$LAST" "$GITHUB_SHA" | grep -qE '^(resources/(js|css)/|package(-lock)?\.json$|vite\.config\.js$)'; then
              echo "Frontend files changed: building assets"
            else
              build=false
              echo "No frontend changes since the last deploy: skipping npm install and build"
            fi
          else
            echo "No usable previous deploy record: doing a full build"
          fi
          echo "frontend=$build" >> "$GITHUB_OUTPUT"

      # Build Vue.js frontend here (the host has no Node.js); public/build/ is then synced to the server
      - name: Setup Node.js
        if: ${{ steps.changes.outputs.frontend != 'false' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies
        if: ${{ steps.changes.outputs.frontend != 'false' }}
        run: npm ci --no-audit --no-fund

      - name: Build Frontend Assets
        if: ${{ steps.changes.outputs.frontend != 'false' }}
        run: npm run build

      - name: Verify Build Output
        if: ${{ steps.changes.outputs.frontend != 'false' }}
        run: |
          if [ ! -f public/build/manifest.json ]; then
            echo "ERROR: public/build/manifest.json NOT found!"
            exit 1
          fi
          echo "Build OK: $(find public/build -type f | wc -l) files"

      - name: Deploy to server
        if: ${{ vars.SSH_HOST_DEV && vars.SSH_USERNAME_DEV && vars.DEPLOY_PATH_DEV }}
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH_DEV }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -eo pipefail
          # --checksum: a fresh checkout has new timestamps on every file, so compare content and
          # send only files that really changed.
          # No --delete: server-only files (.env*, uploads, logs) are never removed.
          rsync -az --checksum --stats --no-perms --no-owner --no-group \
            -e ssh \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='storage/logs' \
            --exclude='storage/framework/cache' \
            --exclude='storage/framework/sessions' \
            --exclude='storage/framework/views' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.deploy-sha' \
            --exclude='.DS_Store' \
            --exclude='Thumbs.db' \
            --exclude='resources/js' \
            --exclude='resources/css' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='vite.config.js' \
            ./ "deploy:$DEPLOY_PATH/" | grep -E 'Number of (regular )?files|Total transferred file size'

          ssh deploy "DEPLOY_PATH='$DEPLOY_PATH' GIT_SHA='$GIT_SHA' bash -s" <<'REMOTE'
          set -e
          cd "$DEPLOY_PATH"
          mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
          [ -f composer.json ] || { echo "ERROR: composer.json not found in $DEPLOY_PATH"; exit 1; }

          # PHP packages: only when composer.lock changed (or vendor is missing)
          NEW_LOCK=$(sha256sum composer.lock 2>/dev/null | cut -d' ' -f1)
          OLD_LOCK=$(cat vendor/.composer-lock.sha256 2>/dev/null || true)
          if [ ! -f vendor/autoload.php ] || [ "$NEW_LOCK" != "$OLD_LOCK" ]; then
            echo "Installing PHP packages (composer.lock changed or vendor missing)"
            composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist \
              || composer install --optimize-autoloader --no-interaction --prefer-dist
            echo "$NEW_LOCK" > vendor/.composer-lock.sha256
          else
            echo "composer.lock unchanged: skipping composer install"
          fi
          [ -f vendor/autoload.php ] || { echo "ERROR: vendor/autoload.php missing"; exit 1; }

          # public/storage is gitignored (not rsynced), so uploaded media 404s without this link
          [ -e public/storage ] || php artisan storage:link || echo "WARNING: storage:link failed"

          php artisan migrate --force || { echo "ERROR: migration failed"; php artisan migrate:status || true; exit 1; }

          # View and config caches only; the application cache (e.g. OAuth state tokens) is left alone
          php artisan view:clear
          php artisan config:clear

          echo "$GIT_SHA" > .deploy-sha
          echo "Deployed $GIT_SHA"
          REMOTE

      - name: Restart PHP-FPM (if needed)
        if: ${{ vars.SSH_HOST_DEV && vars.SSH_USERNAME_DEV && vars.DEPLOY_PATH_DEV && vars.RESTART_PHP_FPM_DEV == 'true' }}
        run: |
          ssh deploy 'sudo systemctl restart php8.2-fpm || sudo systemctl restart php-fpm || echo "PHP-FPM restart skipped"'
